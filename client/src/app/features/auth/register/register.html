<section class="auth-card">
    <h2>Create account</h2>
    <form [formGroup]="registerForm" (ngSubmit)="register()">
        <label>
            Full name
            <input type="text" formControlName="name" autocomplete="name" />
        </label>

        <p *ngIf="(registerForm.controls.name.touched && registerForm.controls.name.invalid)">Name must be at least 2
            characters.</p>


        <label>
            Email
            <input type="email" formControlName="email" autocomplete="email" />
        </label>
        <p *ngIf="registerForm.controls.email.touched && registerForm.controls.email.invalid">Please enter a valid email
            address.</p>


        <label>
            Password
            <input type="password" formControlName="password" autocomplete="new-password" />
        </label>

        <p *ngIf="registerForm.controls.password.touched && registerForm.controls.password.invalid">Password must be at
            least 4 characters.</p>

        <p *ngIf="errorMessage">{{ errorMessage }}</p>

        <button type="submit">Register</button>
    </form>

    <p>
        Already have an account?
        <a routerLink="/login">Log in</a>
    </p>
</section>
